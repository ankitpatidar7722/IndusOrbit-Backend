<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SOP — Picklist Status</title>
<style>
  :root { --teal:#0f6a72; --ink:#1e293b; --muted:#5b6b7f; --line:#e3e8ee; --bg:#f4f7f9; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Segoe UI',system-ui,Arial,sans-serif; color:var(--ink); background:var(--bg); }
  .wrap { max-width:920px; margin:0 auto; padding:0 20px 60px; }
  .topbar { position:sticky; top:0; z-index:10; background:var(--teal); color:#fff; padding:14px 20px;
            display:flex; align-items:center; justify-content:space-between; box-shadow:0 2px 10px rgba(0,0,0,.15); }
  .brand { font-weight:800; letter-spacing:.5px; font-size:15px; }
  .brand small { display:block; font-weight:500; font-size:10.5px; opacity:.85; letter-spacing:.3px; }
  .btn-pdf { background:#fff; color:var(--teal); border:none; border-radius:8px; padding:8px 15px;
             font-weight:700; font-size:13px; cursor:pointer; display:inline-flex; align-items:center; gap:7px; }
  .btn-pdf:hover { background:#eafafa; }
  header.doc { background:#fff; border:1px solid var(--line); border-top:4px solid var(--teal);
               border-radius:0 0 14px 14px; padding:26px 30px; margin-bottom:22px; }
  header.doc h1 { margin:0; font-size:26px; color:var(--teal); }
  header.doc .kicker { font-size:12px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
  section.card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:22px 26px; margin-bottom:22px; }
  section.card h2 { margin:0 0 12px; font-size:16px; color:var(--ink); display:flex; align-items:center; gap:9px; }
  section.card h2::before { content:""; width:5px; height:18px; background:var(--teal); border-radius:3px; }
  .definition { font-size:14.5px; line-height:1.7; color:#334155; }
  ol.steps { margin:0; padding-left:0; counter-reset:s; list-style:none; }
  ol.steps li { counter-increment:s; position:relative; padding:9px 0 9px 42px; border-bottom:1px dashed var(--line); font-size:14px; line-height:1.55; }
  ol.steps li:last-child { border-bottom:none; }
  ol.steps li::before { content:counter(s); position:absolute; left:0; top:8px; width:26px; height:26px; border-radius:50%;
                        background:var(--teal); color:#fff; font-size:12.5px; font-weight:700; display:grid; place-items:center; }
  figure.shot { margin:0 0 26px; }
  figure.shot .cap { font-size:13.5px; color:#334155; margin-bottom:8px; display:flex; align-items:flex-start; gap:9px; line-height:1.5; }
  .cap-n { flex:0 0 auto; width:22px; height:22px; border-radius:50%; background:#e6f4f5; color:var(--teal); font-weight:700; font-size:12px; display:grid; place-items:center; }
  figure.shot img { width:100%; border:1px solid var(--line); border-radius:10px; box-shadow:0 4px 14px rgba(16,24,40,.08); }
  footer.doc { text-align:center; color:var(--muted); font-size:12px; padding-top:14px; border-top:1px solid var(--line); }
  @media print {
    .topbar { position:static; box-shadow:none; }
    .btn-pdf { display:none; }
    body { background:#fff; }
    figure.shot, section.card { break-inside:avoid; }
  }
</style></head>
